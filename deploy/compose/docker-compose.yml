# Local dev stack (laptop; correctness and relative comparisons only, NOT for
# published numbers). Phase 0 services: twmock, twnull, Prometheus, Grafana.
# ClickHouse (Phase 1 WP1.6) and Tempo are added when their phases land.
#
#   make dev-up       then point twload at http://127.0.0.1:9200
#   Grafana: http://127.0.0.1:3000  (anonymous admin, local only)
#
# NOTE: written without Docker available in the authoring environment; validate
# with `docker compose config` and a first `make dev-up` before relying on it.
name: tripwire
services:
  twmock:
    build: { context: ../.., args: { BIN: twmock } }
    command: ["-listen", ":9000", "-admin", ":9100", "-events", "64", "-gap", "const:20ms"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9100:9100"]
    ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
  twnull:
    build: { context: ../.., args: { BIN: twnull } }
    command: ["-listen", ":9200", "-admin", ":9201", "-upstream", "http://twmock:9000"]
    ports: ["127.0.0.1:9200:9200", "127.0.0.1:9201:9201"]
    depends_on: [twmock]
    ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=native-histograms"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
